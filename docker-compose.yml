version: '3.8'

services:
  video-processor:
    build: .
    container_name: video-processing-worker
    ports:
      - "8080:8080"
    environment:
      - AWS_REGION=${AWS_REGION:-us-east-1}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - VIDEO_PROCESSING_FPS=1
      - S3_BUCKET_NAME=${S3_BUCKET_NAME:-fiap-videos}
    volumes:
      - ./temp:/app/temp
      - ./logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/api/videos/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 40s
