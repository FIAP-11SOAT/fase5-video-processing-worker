name: CD (Build, Push ECR e Deploy K8s)

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:

      # ============================
      # 1. CHECKOUT
      # ============================
      - name: Checkout
        uses: actions/checkout@v4

      # ============================
      # 2. AWS CREDENTIALS
      # ============================
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      # ============================
      # 3. OBTER ACCOUNT ID AWS
      # ============================
      - name: Get AWS Account ID
        run: |
          echo "AWS_ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)" >> $GITHUB_ENV

      # ============================
      # 4. GERAR TAG DA IMAGEM
      # ============================
      - name: Generate image tag
        run: echo "IMAGE_TAG=$(echo $GITHUB_SHA | cut -c1-7)" >> $GITHUB_ENV

      # ============================
      # 5. APLICAR TERRAFORM (IRSA)
      # ============================
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.11.0

      - name: Terraform Init
        working-directory: deploy/terraform
        run: terraform init

      - name: Terraform Validate
        working-directory: deploy/terraform
        run: terraform validate

      - name: Terraform Apply (IRSA)
        working-directory: deploy/terraform
        run: terraform apply -auto-approve
        env:
          TF_VAR_cluster_name: ${{ secrets.EKS_CLUSTER_NAME }}
          TF_VAR_s3_bucket_name: ${{ secrets.S3_BUCKET_NAME }}

      # ============================
      # 6. LOGIN NO ECR
      # ============================
      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      # ============================
      # 7. CONFIGURAR JAVA 21
      # ============================
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      # ============================
      # 8. CACHE MAVEN
      # ============================
      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      # ============================
      # 9. BUILD MAVEN
      # ============================
      - name: Build JAR
        run: mvn clean package -DskipTests

      # ============================
      # 10. CRIAR REPOSITORIO ECR (se nao existir)
      # ============================
      - name: Ensure ECR repository exists
        run: |
          aws ecr describe-repositories --repository-names fase5-video-processing-worker 2>/dev/null || \
          aws ecr create-repository --repository-name fase5-video-processing-worker

      # ============================
      # 11. BUILD DOCKER
      # ============================
      - name: Build Docker image
        run: |
          ECR_URL="$AWS_ACCOUNT_ID.dkr.ecr.us-east-1.amazonaws.com/fase5-video-processing-worker"
          docker build -t video-processing-worker .
          docker tag video-processing-worker:latest "$ECR_URL:$IMAGE_TAG"
          docker tag video-processing-worker:latest "$ECR_URL:latest"

      # ============================
      # 12. PUSH DOCKER
      # ============================
      - name: Push Docker image
        run: |
          ECR_URL="$AWS_ACCOUNT_ID.dkr.ecr.us-east-1.amazonaws.com/fase5-video-processing-worker"
          docker push "$ECR_URL:$IMAGE_TAG"
          docker push "$ECR_URL:latest"

      # ============================
      # 13. CONFIGURAR KUBECTL
      # ============================
      - name: Configure kubectl for EKS
        run: |
          aws eks update-kubeconfig \
            --region us-east-1 \
            --name ${{ secrets.EKS_CLUSTER_NAME }}

      # ============================
      # 14. APLICAR MANIFESTS K8s
      # ============================
      - name: Apply Kubernetes namespace
        run: kubectl apply -f deploy/k8s/n.yml

      - name: Apply Kubernetes deployment
        run: kubectl apply -f deploy/k8s/d.yml

      # ============================
      # 15. ATUALIZAR IMAGEM NO K8s
      # ============================
      - name: Update deployment image
        run: |
          ECR_URL="$AWS_ACCOUNT_ID.dkr.ecr.us-east-1.amazonaws.com/fase5-video-processing-worker"
          kubectl set image deployment/video-processing-worker \
            video-processing-worker="$ECR_URL:$IMAGE_TAG" \
            -n fase5-video-processing-worker

      # ============================
      # 16. VERIFICAR ROLLOUT
      # ============================
      - name: Wait for rollout to complete
        run: |
          kubectl rollout status deployment/video-processing-worker \
            -n fase5-video-processing-worker \
            --timeout=300s
