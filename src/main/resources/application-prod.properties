# Production Profile Configuration
# Este arquivo é usado quando -Dspring.profiles.active=prod

# Spring Boot Configuration
spring.application.name=video-processing-worker
server.port=8080

# AWS Configuration (use variáveis de ambiente ou IAM roles)
aws.region=${AWS_REGION:us-east-1}

# Video Processing Configuration
video.processing.fps=1
video.processing.temp-dir=/tmp/video-processing

# S3 Configuration
s3.bucket.name=${S3_BUCKET_NAME:fiap-videos}
s3.output-bucket=${S3_OUTPUT_BUCKET:fase5-processed-frames}
s3.multipart.part-size=10485760

# SQS Configuration
sqs.queue-name=${SQS_QUEUE_NAME:fase5-video-processing-queue}
sqs.notification-queue-name=${SQS_NOTIFICATION_QUEUE:fase5-video-notification-queue}

# DynamoDB Configuration
dynamodb.table-name=${DYNAMODB_TABLE_NAME:fase5-video-processing}

# Logging - JSON format para CloudWatch
logging.level.root=INFO
logging.level.com.fiap.videoprocessor=INFO
logging.level.software.amazon.awssdk=WARN
logging.level.org.springframework.cloud.aws=INFO

# Server Configuration
server.error.include-message=always
server.error.include-stacktrace=never
server.error.include-binding-errors=never

# File Upload Configuration
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=500MB
spring.servlet.multipart.max-request-size=500MB

# Shutdown graceful
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s
