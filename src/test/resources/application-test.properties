spring.application.name=video-processing-worker-test
aws.region=us-east-1
video.processing.fps=1
video.processing.temp-dir=./temp-test
s3.bucket.name=test-bucket
s3.output-bucket=test-output-bucket
sqs.queue-name=test-video-queue
sqs.notification-queue-name=test-notification-queue
dynamodb.table-name=test-video-processing

# Desabilita auto-configuracao AWS para nao tentar conectar em testes
spring.autoconfigure.exclude=\
  io.awspring.cloud.autoconfigure.sqs.SqsAutoConfiguration,\
  io.awspring.cloud.autoconfigure.s3.S3AutoConfiguration

logging.level.root=WARN
logging.level.com.fiap.videoprocessor=INFO
